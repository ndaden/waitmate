name: Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target aarch64-apple-darwin'

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: 'aarch64-apple-darwin'

      - name: Install dependencies
        run: npm ci

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'WaitMate ${{ github.ref_name }}'
          releaseBody: |
            ## WaitMate ${{ github.ref_name }}

            Lightweight, non-intrusive AI waiting companion for macOS.

            ### Key Features
            - Discreet floating companion (160x160) that expands during AI processing and retracts on completion.
            - macOS Menu Bar accessory without Dock clutter.
            - Built-in micro-activities:
              - Snake Arcade with high score tracking.
              - Ambient YouTube player (muted by default) with video search and preset channels.
            - Universal auto-detection for terminal CLI tools (Claude Code, Ollama, Aider) and Antigravity IDE.

            ### Installation
            Download the `.dmg` file below, open it, and drag **WaitMate** into your **Applications** folder.
          releaseDraft: false
          prerelease: ${{ contains(github.ref_name, 'beta') || contains(github.ref_name, 'alpha') }}
          args: ${{ matrix.args }}
